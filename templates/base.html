<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nexora Store{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="announcement">COMPLIMENTARY GIFT PACKAGING ON EVERY ORDER</div>

    <nav class="navbar">
        <a href="{{ url_for('home') }}" class="logo">NEXORA</a>
        <ul class="nav-links">
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a href="{{ url_for('collections') }}">Collections</a></li>
            <li><a href="{{ url_for('about') }}">About Us</a></li>
            <li><a href="{{ url_for('contact') }}">Contact Us</a></li>
        </ul>
        <a href="{{ url_for('view_cart') }}" class="cart-link">Cart ({{ cart_count }})</a>
    </nav>

    {% block content %}{% endblock %}

    <footer class="footer">
        <div class="logo">NEXORA</div>
        <ul class="footer-links">
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a href="{{ url_for('collections') }}">Collections</a></li>
            <li><a href="{{ url_for('about') }}">About Us</a></li>
            <li><a href="{{ url_for('contact') }}">Contact Us</a></li>
        </ul>
        <p>© 2026 Nexora Store. All rights reserved.</p>
    </footer>

    <script>
    document.querySelectorAll(".add-to-cart-btn").forEach(button => {
        button.addEventListener("click", async () => {
            const productId = button.dataset.productId;

            const response = await fetch(`/add-to-cart/${productId}`, {
                method: "POST"
            });
            const data = await response.json();

            if (data.success) {
                document.querySelector(".cart-link").textContent = `Cart (${data.cart_count})`;
                button.textContent = "ADDED ✓";
                setTimeout(() => { button.textContent = "ADD TO CART"; }, 1200);
            }
        });
    });
    </script>
</body>
</html>
